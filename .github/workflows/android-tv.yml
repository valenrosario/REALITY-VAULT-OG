name: App para la TV

on:
  push:
    branches: [main]
    paths:
      - 'app-tv/**'
      - 'config.js'
      - '.github/workflows/android-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar la app de la TV
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Publicar para descargar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk reality-vault-tv.apk
          gh release delete tv --yes --cleanup-tag || true
          gh release create tv reality-vault-tv.apk --title "REALITY VAULT · TV" --notes "App para Android TV / Google TV generada automáticamente. Descargá reality-vault-tv.apk e instalala en la tele." --target "$GITHUB_SHA"
