name: App para el celular

on:
  push:
    branches: [main]
    paths:
      - 'app-mobile/**'
      - 'app-tv/app/src/main/java/com/realityvault/tv/Data.kt'
      - 'app-tv/app/src/main/java/com/realityvault/tv/Embed.kt'
      - 'app-tv/app/src/main/java/com/realityvault/tv/UpdateCore.kt'
      - 'app-tv/app/src/main/java/com/realityvault/tv/LikeHeart.kt'
      - 'app-tv/app/src/main/java/com/realityvault/tv/FichaBlur.kt'
      - 'config.js'
      - '.github/workflows/android-mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Si el secret de la clave de firma está configurado, lo escribe en disco para que
      # build.gradle.kts lo use al firmar el release. Si no está configurado, el archivo
      # simplemente no existe y el build cae al keystore de debug de siempre (las
      # actualizaciones no van a poder instalarse encima de una versión anterior hasta que
      # se configure el secret — ver instrucciones del sistema de actualizaciones).
      - name: Preparar la clave de firma (si está configurada)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          fi
      - name: Compilar la app del celular
        env:
          RV_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RV_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RV_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RV_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Publicar para descargar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk reality-vault.apk
          export SHA256=$(sha256sum reality-vault.apk | cut -d' ' -f1)
          export NOTES=$(git log -1 --format=%s)
          python3 -c "
          import json, os
          data = {
              'versionCode': int(os.environ['RUN_NUMBER']),
              'versionName': '1.' + os.environ['RUN_NUMBER'],
              'apkUrl': 'https://github.com/valenrosario/REALITY-VAULT-OG/releases/download/mobile/reality-vault.apk',
              'notes': os.environ['NOTES'],
              'sha256': os.environ['SHA256'],
              'mandatory': False,
          }
          open('update.json', 'w').write(json.dumps(data, indent=2))
          "
          gh release delete mobile --yes --cleanup-tag || true
          sleep 3
          gh release create mobile reality-vault.apk update.json --title "REALITY VAULT · Celular" --notes "App nativa para celulares Android generada automáticamente. Descargá reality-vault.apk e instalala en el celular." --target "$GITHUB_SHA"
          # a veces GitHub la deja como borrador (y el enlace de descarga da 404): se publica sí o sí
          gh release edit mobile --draft=false || true
